<div class="d-flex align-items-center justify-content-between p-3 mb-3 task-card {% if task.priority.name == 'HIGH' %}priority-high{% elif task.priority.name == 'LOW' %}priority-low{% else %}priority-normal{% endif %} {% if task.status.name == 'COMPLETED' %}completed-state{% endif %}"
     style="animation: fadeIn 0.3s ease-out forwards;">
    <div class="d-flex align-items-center gap-3" style="flex: 1; min-width: 0;">
        <!-- Checkbox / Toggle link -->
        <a href="/complete/{{ task.id }}" class="text-decoration-none">
            <div class="task-checkbox {% if task.status.name == 'COMPLETED' %}completed{% endif %}">
                <i class="bi bi-check-lg" style="font-size: 0.85rem; stroke-width: 2px;"></i>
            </div>
        </a>

        <!-- Content -->
        <div style="min-width: 0;">
            <h6 class="mb-0 fw-bold {% if task.status.name == 'COMPLETED' %}text-decoration-line-through{% else %}text-white{% endif %}" 
                style="font-size: 0.95rem; word-break: break-word; font-weight: 700; {% if task.status.name == 'COMPLETED' %}color: #7c8db5;{% endif %}">
                {{ task.title }}
            </h6>
            
            <div class="d-flex flex-wrap align-items-center gap-2 mt-1">
                <span class="d-inline-flex align-items-center gap-1" style="font-size: 0.75rem; color: #a5b4fc;">
                    <i class="bi bi-calendar3" style="font-size: 0.7rem;"></i>
                    {{ task.deadline }}
                </span>
                
                {% if task.priority.name == 'HIGH' %}
                    <span class="badge rounded-pill d-inline-flex align-items-center gap-1" 
                          style="font-size: 0.65rem; font-weight: 800; background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.25);">
                        <i class="bi bi-exclamation-triangle" style="font-size: 0.6rem;"></i> HIGH PRIORITY
                    </span>
                {% elif task.priority.name == 'LOW' %}
                    <span class="badge rounded-pill d-inline-flex align-items-center gap-1" 
                          style="font-size: 0.65rem; font-weight: 800; background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.25);">
                        LOW
                    </span>
                {% else %}
                    <span class="badge rounded-pill d-inline-flex align-items-center gap-1" 
                          style="font-size: 0.65rem; font-weight: 800; background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.25);">
                        NORMAL
                    </span>
                {% endif %}

                {% if task.status.name == 'COMPLETED' %}
                    <span class="badge rounded-pill d-inline-flex align-items-center gap-1" 
                          style="font-size: 0.65rem; font-weight: 800; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25);">
                        <i class="bi bi-check" style="font-size: 0.75rem;"></i> DONE
                    </span>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Action Button (Delete) -->
    <a href="/delete/{{ task.id }}" 
       class="btn-icon btn-icon-danger ms-2" 
       style="width: 34px; height: 34px; flex-shrink: 0;"
       title="Delete task">
        <i class="bi bi-trash-fill" style="font-size: 0.9rem;"></i>
    </a>
</div>
